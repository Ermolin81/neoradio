name: Build NeoRadio Car APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 and Java 17
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Initialize Capacitor Android project
        run: |
          npm install
          npx cap add android
          npx cap copy android

      - name: 4. Inject Kotlin Media3 engine and configure Android project
        run: |
          DEST="android/app/src/main/java/com/neoradio/carplayer"
          mkdir -p "$DEST"
          cp android-src/RadioService.kt "$DEST/"
          cp android-src/NativeRadioPlugin.kt "$DEST/"

          # Deterministic MainActivity registration for NativeRadioPlugin
          cat << 'EOF' > "$DEST/MainActivity.java"
          package com.neoradio.carplayer;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeRadioPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          # Add Kotlin classpath to root build.gradle
          sed -i '/dependencies {/a \        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"' android/build.gradle

          # Add Kotlin plugin and Media3 (ExoPlayer) dependencies to app/build.gradle
          cat << 'EOF' >> android/app/build.gradle
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation "androidx.media3:media3-exoplayer:1.4.1"
              implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
              implementation "androidx.media3:media3-session:1.4.1"
              implementation "com.google.guava:guava:32.1.3-android"
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
          }
          EOF

          # Configure AndroidManifest.xml: permissions, cleartext traffic, and foreground MediaSessionService
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"

          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"

          sed -i '/<\/application>/i \        <service android:name=".RadioService" android:foregroundServiceType="mediaPlayback" android:exported="true">\n            <intent-filter>\n                <action android:name="androidx.media3.session.MediaSessionService"/>\n            </intent-filter>\n        </service>' "$MANIFEST"

      - name: 5. Compile Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 6. Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoRadio-Car-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
